name: zello_app
description: "Zello Saúde - App Unificado"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  zello_shared:
    path: ../zello_shared
  go_router: ^14.0.0
  flutter_riverpod: ^2.6.0
  google_fonts: ^6.2.0
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.0
  geocoding: ^4.0.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  supabase_flutter: ^2.8.4
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4
  open_file: ^3.5.7
  path_provider: ^2.1.5
  file_picker: ^8.0.0
  syncfusion_flutter_charts: ^28.0.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "assets/icons/adaptive_background.png"
  adaptive_icon_foreground: "assets/icons/adaptive_foreground.png"
  min_sdk_android: 23
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
